[package]
name = "synestesia"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20.1"
cpal = "0.18.2"
rand = "0.9"
realfft = "3.5.1"
ringbuf = "0.6.0"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "aiff", "alac", "flac"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
