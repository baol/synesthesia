[package]
name = "synestesia"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20.1"
cpal = { version = "0.18.2", features = ["pulseaudio"] }
rand = "0.9"
realfft = "3.5.1"
ringbuf = "0.6.0"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "aiff", "alac", "flac"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

# The built-in sound classifier (is someone singing?), macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSArray"] }
objc2-sound-analysis = "0.3.2"
objc2-avf-audio = { version = "0.3.2", features = ["AVAudioBuffer", "AVAudioFormat", "AVAudioTypes", "objc2-core-audio-types"] }
objc2-core-media = { version = "0.3", features = ["CMTime"] }
